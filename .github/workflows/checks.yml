name: Checks
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dorfduesen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/dorfduesen_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/dorfduesen_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-never-use-in-production
      CRON_SECRET: ci-only-cron-secret-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: HTTP smoke checks
        env:
          TEST_BASE_URL: http://127.0.0.1:3107
        run: |
          npm start -- --hostname 127.0.0.1 --port 3107 > /tmp/dorfduesen-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/http-smoke.mjs
